# Harden cloud-init on the MEASURED Azure CVM image.
#
# custom-data / user-data is NOT part of the UKI + dm-verity → PCR11 measurement.
# Without this, a VM-RBAC adversary (the exact adversary confidential compute is
# meant to exclude) could boot a VM from the pinned gallery image with malicious
# custom-data, leave PCR11 unchanged so attestation still passes, and run root
# code on the writable overlay root that reads the HPKE-sealed secret dispatcher
# delivered into the TEE.
#
# The measured agent auto-starts from a systemd unit on the measured root, and
# dispatcher never supplies custom-data — so disabling user-data processing keeps
# provisioning/networking intact while removing the code-exec path. The datasource
# is pinned to Azure so no rogue datasource can be selected.
#
# NOTE: changing the measured root changes the dm-verity roothash → PCR11, so the
# pin must be re-captured (`dispatcher confidential capture azure-snp`) after this.
allow_userdata: false
datasource_list: [ Azure ]
