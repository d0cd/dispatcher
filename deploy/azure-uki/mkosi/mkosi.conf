# WIP scaffold — see README.md. Does not build cleanly on Ubuntu 24.04 + mkosi
# 20.2 (no bootctl; pre-t64 package names). Recommended: newer mkosi + Debian/
# Fedora base. Bake dispatcher-attest-azuresnp into a UKI + dm-verity root so
# PCR11 attests the agent (consumed by attest.NewAzureSNPAttester).
[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
Output=azurecvm

[Content]
Bootable=yes
Bootloader=uki
KernelCommandLine=console=ttyS0 earlyprintk=ttyS0 rw
# Hyper-V drivers (linux-image-azure) are required to boot on Azure; cloud-init
# handles Azure provisioning. systemd-boot/ukify build the UKI.
Packages=
        systemd
        systemd-sysv
        systemd-boot
        systemd-ukify
        systemd-resolved
        udev
        dbus
        linux-image-azure
        openssh-server
        cloud-init
        ca-certificates
        sudo
        bash
        coreutils
        util-linux
        iproute2

[Validation]
# Secure Boot off is fine for the direct SNP+vTPM path (no MAA); PCR11 pinning
# detects a swapped image before any secret is sealed.
SecureBoot=no

# TODO (dedicated effort): add mkosi.repart/ verity partitions so the roothash is
# injected into the UKI cmdline and measured into PCR11. Then upload the image to
# an Azure Shared Image Gallery (ConfidentialVmSupported) and capture PCR11.
