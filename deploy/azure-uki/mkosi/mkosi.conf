# Builds a bootable Azure Confidential VM image with dispatcher-attest-azuresnp.
# VALIDATED end-to-end (mkosi 27 from git): builds a dm-verity image that boots
# on an Azure CVM, runs the agent from the measured root, and PCR11 attests it.
# Build on a Linux host: `mkosi --force build` (needs systemd-boot-efi + mtools
# on the host; install mkosi from git, not apt/PyPI). See README.md for the full
# VHD -> gallery -> CVM flow.
[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
Output=azurecvm

[Content]
Bootable=yes
Bootloader=uki
# systemd.volatile=overlay = writable tmpfs over the measured read-only verity root.
# serial-getty is masked so the console (kept for boot logs) is NOT a login prompt:
# the measured image must expose no interactive access — only the agent's TCP port.
KernelCommandLine=console=ttyS0 earlyprintk=ttyS0 systemd.volatile=overlay systemd.mask=serial-getty@ttyS0.service
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-ukify
        systemd-boot-efi
        udev
        dbus
        linux-image-azure
        # cloud-init is hardened by mkosi.extra/etc/cloud/cloud.cfg.d/99-dispatcher-harden.cfg
        # (allow_userdata:false) so an adversary can't run root code via unmeasured
        # custom-data. It stays only for network/platform provisioning.
        cloud-init
        ca-certificates
        sudo
        bash
        coreutils
        util-linux
        iproute2
        erofs-utils
# No RootPassword and no openssh-server: the agent is reached over its measured
# TCP port, so the image ships zero login credentials. A pinned image with a
# known password would make PCR11 attestation worthless (Azure Serial Console is
# reachable by any principal with VM RBAC — the adversary confidential compute
# excludes). Root stays locked (mkosi default).

[Validation]
# Secure Boot off is fine for direct SNP+vTPM (no MAA); PCR11 pinning detects a
# swapped image before any secret is sealed.
SecureBoot=no

# mkosi.repart/ defines the dm-verity root; mkosi injects the roothash into the
# UKI cmdline, measured into PCR11 -> attests the agent-carrying root. VALIDATED.
