# Builds a bootable Azure Confidential VM image with dispatcher-attest-azuresnp.
# VALIDATED: this config (with mkosi 27 from git) builds an image that boots on
# an Azure CVM, provisions via cloud-init, and runs the agent + attests E2E.
# Build on a Linux host: `mkosi --force build` (needs systemd-boot-efi + mtools
# on the host; install mkosi from git, not apt/PyPI). See README.md for the full
# VHD -> gallery -> CVM flow.
[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
Output=azurecvm

[Content]
Bootable=yes
Bootloader=uki
KernelCommandLine=console=ttyS0 earlyprintk=ttyS0 rw
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-ukify
        systemd-boot-efi
        udev
        dbus
        linux-image-azure
        openssh-server
        cloud-init
        ca-certificates
        sudo
        bash
        coreutils
        util-linux
        iproute2
RootPassword=dispatcher

[Validation]
# Secure Boot off is fine for direct SNP+vTPM (no MAA); PCR11 pinning detects a
# swapped image before any secret is sealed.
SecureBoot=no

# TODO: add mkosi.repart/ verity partitions so the roothash lands in the UKI
# cmdline -> PCR11 measures the agent-carrying root (the measured-boot property).
