name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"; echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        env:
          DISPATCHER_DISABLE_LIVE_PRICING: "1"
        run: go test -race -timeout 5m -coverprofile=coverage.out ./...

      - name: coverage report
        run: go tool cover -func=coverage.out | tail -1

      - name: build & smoke the binary
        run: |
          go build -o dispatcher ./cmd/dispatcher
          ./dispatcher --version
          ./dispatcher --help >/dev/null

      # Confidential-image durability guard. Measurements are content-addressed, so
      # a change to the attestation agent, its build config, or deps invalidates a
      # pinned image's measurement. When pins are committed to deploy/confidential-pins.yaml
      # (produced by `confidential capture --pin --pins …`), this fails if any drifted
      # from the tree — the signal to rebuild, re-capture, and re-pin. It does not
      # build images (that needs the per-cloud hosts). The guard is inactive, and says
      # so, until the registry is committed.
      - name: confidential pin drift guard
        run: |
          if [ -f deploy/confidential-pins.yaml ]; then
            ./dispatcher confidential check --pins deploy/confidential-pins.yaml --repo-root .
          else
            echo "drift guard inactive: no committed pins at deploy/confidential-pins.yaml"
            echo "activate with: dispatcher confidential capture --pin --pins deploy/confidential-pins.yaml …"
          fi

      # Dependency/stdlib CVE scan. Non-blocking: a freshly-disclosed stdlib
      # advisory shouldn't red the build before the toolchain is patched — it
      # surfaces as an annotation to act on.
      - name: govulncheck
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # End-to-end lanes exercise the real k8s / terraform / ssh execution paths —
  # the parts unit tests can't reach. Each test skips if its prerequisite is
  # absent. Runs on main-push and on-demand (not every PR) until proven stable.
  e2e:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: helm/kind-action@v1
        with:
          cluster_name: dispatcher-e2e
      - name: k8s e2e (k8se2e)
        run: go test -tags k8se2e -timeout 8m ./internal/cloudvm/

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: terraform e2e (tfe2e)
        run: go test -tags tfe2e ./internal/target/

      - name: set up passwordless localhost ssh
        run: |
          sudo systemctl start ssh || sudo service ssh start || true
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys ~/.ssh/id_ed25519
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: ssh e2e (sshe2e)
        run: go test -tags sshe2e ./internal/adapter/
