name: Live Hetzner stress lane

# Opt-in live-provider reliability check: provisions a REAL Hetzner VM and runs a
# CPU-saturating job end-to-end, asserting control-plane headroom / watchdog
# renewal (the run completes under saturation), artifact recovery, budget
# accounting, and zero residual resources. It costs real money, so it is
# **manual only** (workflow_dispatch) — it never runs on a schedule, PR, or fork.
# Trigger it deliberately from the Actions tab when you want to spend.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hetzner-stress:
    # Never run on forks (no secrets) — only the canonical repo.
    if: github.repository == 'd0cd/dispatcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.25.12'
          cache: true

      - name: install hcloud CLI
        run: |
          curl -fsSL https://github.com/hetznercloud/cli/releases/latest/download/hcloud-linux-amd64.tar.gz \
            | tar -xz hcloud
          sudo mv hcloud /usr/local/bin/

      - name: hetzner stress lane (hetznere2e)
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          DISPATCHER_DISABLE_LIVE_PRICING: "1"
        run: go test -tags hetznere2e -run TestHetznerStress -timeout 15m -v ./internal/cli/
